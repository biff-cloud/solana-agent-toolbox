[project]
name = "solana-agent-toolbox-mcp"
version = "1.2.0"
description = "MCP server: x402-paid Solana tools for AI agents (token safety, tx-error explainer, wallet snapshot)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "x402[svm,httpx]==2.25.0", "httpx"]

[project.scripts]
solana-agent-toolbox-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]
