name: keepalive
# Pings the free Render instance so agents don't hit a ~1 min cold start. Free endpoints only (no payment).
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 https://solana-agent-toolbox.onrender.com/health
